<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Trainingslog · Bert Nijs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700;800&family=Space+Mono:wght@400;700&display=swap');
:root {
  --bg:#08080f; --panel:#0d0d18; --border:#1c1c30;
  --accent:#7b5cff; --cyan:#00e5ff; --green:#00ffb3;
  --red:#ff3d6b; --yellow:#ffd600; --text:#c0c0d8; --muted:#8888aa;
  --glow-a:0 0 12px #7b5cff88,0 0 30px #7b5cff33;
  --glow-c:0 0 12px #00e5ff88,0 0 30px #00e5ff33;
  --glow-g:0 0 12px #00ffb388,0 0 30px #00ffb333;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Oxanium',sans-serif;font-size:14px;overflow-x:hidden;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 40% at 10% 10%,#7b5cff0a 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 90% 90%,#00e5ff08 0%,transparent 60%);pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(123,92,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(123,92,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
@keyframes pulse-line{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes popup-in{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes neon-a{0%,100%{text-shadow:var(--glow-a)}50%{text-shadow:0 0 4px #7b5cffcc,0 0 30px #7b5cff99}}
header{position:relative;padding:14px 18px 12px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0a0a16 0%,transparent 100%);z-index:10;}
header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),var(--cyan),transparent);animation:pulse-line 4s ease-in-out infinite;}
.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.logo{font-family:'Oxanium',sans-serif;font-size:clamp(18px,5.5vw,26px);font-weight:800;letter-spacing:4px;animation:neon-a 5s ease-in-out infinite;display:flex;align-items:baseline;gap:0;align-items:center;}
.logo-link-wrap{font-size:clamp(11px,3.5vw,15px);opacity:.6;display:flex;align-items:baseline;gap:0;transition:opacity .2s;}
.logo-link-wrap:hover{opacity:.9;}
.logo-bit{color:var(--accent)}.logo-fit{color:var(--cyan)}.logo-beta{color:var(--muted);font-size:.55em;letter-spacing:2px;}
.logo-sep{color:var(--border);font-size:.6em;letter-spacing:0;margin:0 8px;align-self:center;}
.logo-supp-link{text-decoration:none;font-family:'Oxanium',sans-serif;font-weight:800;letter-spacing:4px;animation:neon-a 5s ease-in-out infinite 2.5s;}
.logo-supp-mini{color:var(--green);}
.header-right{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
.meta-item{display:flex;flex-direction:column;align-items:flex-end;}
.meta-label{font-family:monospace;font-size:10px;letter-spacing:2px;color:var(--muted);}
.meta-value{font-family:monospace;font-size:11px;font-weight:700;}
.tabs{display:flex;padding:10px 18px 0;gap:5px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:10;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:6px 14px;font-family:monospace;font-size:10px;letter-spacing:1.5px;cursor:pointer;border:1px solid var(--muted);background:transparent;color:var(--muted);clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);transition:all .2s;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;user-select:none;}
.tab:hover{color:var(--cyan);border-color:var(--cyan);}
.tab.active{color:var(--accent);border-color:var(--accent);background:#7b5cff11;box-shadow:0 0 12px #7b5cff22;}
#period-badge{font-family:monospace;font-size:9px;color:var(--muted);padding:4px 0 10px 18px;position:relative;z-index:10;}
#period-badge span{color:var(--cyan);}
.main{padding:0 12px 24px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;}
.panel{background:var(--panel);border:1px solid var(--border);padding:14px;position:relative;overflow:hidden;}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent 60%);box-shadow:0 0 8px var(--accent);}
.panel.c::before{background:linear-gradient(90deg,var(--cyan),transparent 60%);box-shadow:0 0 8px var(--cyan);}
.panel.g::before{background:linear-gradient(90deg,var(--green),transparent 60%);box-shadow:0 0 8px var(--green);}
.panel.y::before{background:linear-gradient(90deg,var(--yellow),transparent 60%);box-shadow:0 0 8px var(--yellow);}
.panel.r::before{background:linear-gradient(90deg,var(--red),transparent 60%);box-shadow:0 0 8px var(--red);}
.panel-title{font-family:monospace;font-size:9px;letter-spacing:2.5px;color:var(--accent);margin-bottom:12px;text-transform:uppercase;}
.panel.c .panel-title{color:var(--cyan);}.panel.g .panel-title{color:var(--green);}
.panel.y .panel-title{color:var(--yellow);}.panel.r .panel-title{color:var(--red);}
.lift-toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.lift-mode-btn{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:4px 12px;border:1px solid var(--accent);background:transparent;color:var(--muted);cursor:pointer;clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);transition:all .2s;-webkit-tap-highlight-color:transparent;}
.lift-mode-btn.active{color:var(--accent);background:#7b5cff15;box-shadow:0 0 8px #7b5cff22;}
.lift-filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.lift-btn{font-family:monospace;font-size:9px;letter-spacing:1px;padding:3px 9px;border:1px solid;background:transparent;cursor:pointer;clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);transition:all .15s;opacity:.65;-webkit-tap-highlight-color:transparent;user-select:none;}
.lift-btn.active{opacity:1;}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.stat-card{background:#0a0a15;border:1px solid var(--border);padding:10px 12px;}
.stat-label{font-family:monospace;font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:4px;}
.stat-value{font-size:clamp(18px,5vw,24px);font-weight:700;line-height:1;color:var(--accent);text-shadow:var(--glow-a);}
.stat-value.c{color:var(--cyan);text-shadow:var(--glow-c);}
.stat-value.g{color:var(--green);text-shadow:var(--glow-g);}
.stat-value.r{color:var(--red);}
.stat-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.pr-section-label{font-family:monospace;font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:6px;}
.pr-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.pr-row:last-child{border-bottom:none;}
.pr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.pr-lift{flex:1;}.pr-vals{font-family:monospace;font-size:10px;color:var(--muted);}
.pr-gain{color:var(--green);font-family:monospace;font-size:11px;margin-left:4px;}
.analysis-blocks{display:flex;flex-direction:column;gap:14px;}
.analysis-block{}
.analysis-title{font-family:monospace;font-size:10px;letter-spacing:2px;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.analysis-title.a{color:var(--accent);}.analysis-title.c{color:var(--cyan);}
.analysis-title.g{color:var(--green);}.analysis-title.y{color:var(--yellow);}.analysis-title.r{color:var(--red);}
.analysis-text{font-size:13px;color:var(--text);line-height:1.65;}
.analysis-text b{color:var(--yellow);}.analysis-text em{color:var(--cyan);font-style:normal;}
.new-ex-list{}.new-ex-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px;}
.new-ex-item:last-child{border-bottom:none;}
.new-ex-date{font-family:monospace;font-size:9px;color:var(--muted);white-space:nowrap;margin-left:8px;}
.cd{position:absolute;width:10px;height:10px;border-color:var(--accent);border-style:solid;opacity:.3;}
.cd.tl{top:4px;left:4px;border-width:1px 0 0 1px;}.cd.tr{top:4px;right:4px;border-width:1px 1px 0 0;}
.cd.bl{bottom:4px;left:4px;border-width:0 0 1px 1px;}.cd.br{bottom:4px;right:4px;border-width:0 1px 1px 0;}
.phase-popup{position:fixed;z-index:10000;background:#090912;border:1px solid var(--border);padding:12px 14px;max-width:260px;font-size:12px;line-height:1.6;color:var(--text);box-shadow:0 0 30px rgba(0,0,0,.9);animation:popup-in .15s ease;pointer-events:none;}
.phase-popup-title{font-family:monospace;font-size:10px;letter-spacing:2px;margin-bottom:7px;}
#phase-timeline{margin-top:8px;}
.phase-track{position:relative;height:17px;margin-bottom:2px;}
.phase-block{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;overflow:hidden;white-space:nowrap;border-top:1px solid;}
.phase-block.clickable{cursor:pointer;transition:filter .15s;}.phase-block.clickable:hover{filter:brightness(1.6);}
.phase-block.phase-selected{border-top-width:2px!important;filter:brightness(1.5);outline:1px solid rgba(255,255,255,.15);}
.radar-wrap{width:100%;display:flex;align-items:center;justify-content:center;padding:4px 0;}
/* ── Lift Selector ── */
.lift-selector{margin-bottom:10px;}
.lift-group{display:grid;gap:3px;margin-bottom:3px;}
.lift-group-p{grid-template-columns:repeat(4,1fr);}
.lift-group-s{grid-template-columns:repeat(5,1fr);}
.lift-group-label{font-family:monospace;font-size:9px;letter-spacing:2px;color:var(--text);margin-bottom:3px;padding:7px 10px;cursor:pointer;display:block;border:1px solid var(--border);background:#0d0d18;transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none;}
.lift-group-label:hover{border-color:var(--muted);background:#12121f;}
.lift-group-label.group-active{color:var(--green);border-color:#00ffb344;background:#00ffb30d;box-shadow:0 0 8px #00ffb318;}
.lift-tile{background:#0a0a15;border:1px solid var(--border);padding:5px 2px;text-align:center;user-select:none;}
.lift-tile.active{border-color:var(--tc,var(--cyan));background:color-mix(in srgb, var(--tc,var(--cyan)) 8%, transparent);}
.lift-tile-name{font-family:monospace;font-size:10px;letter-spacing:.5px;color:var(--text);text-transform:uppercase;line-height:1.2;}
.lift-tile.active .lift-tile-name{color:var(--tc,var(--cyan));}
.lift-tile-weight{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--text);margin-top:2px;line-height:1;}
.lift-tile.active .lift-tile-weight{color:var(--tc,var(--cyan));}
.lift-mode-btn.wt-active{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06);}
@media(min-width:768px){
  header{padding:16px 24px 14px;}
  .tabs{padding:14px 24px 0;}
  #period-badge{padding:4px 0 12px 24px;}
  .main{padding:0 24px 28px;display:grid;grid-template-columns:1fr 300px;gap:14px;}
  .lift-panel{grid-row:1;}.right-col{grid-row:1;display:flex;flex-direction:column;gap:12px;}
  .analysis-panel{grid-column:1 / -1;}
  .analysis-blocks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .panel{padding:16px 18px;}
}


.fb-ok{color:var(--green);}
.fb-warn{color:var(--yellow);}
.fb-crit{color:var(--red);}
.fb-info{color:var(--cyan);}


.fb-ok{color:var(--green);}
.fb-warn{color:var(--yellow);}
.fb-crit{color:var(--red);}
.fb-info{color:var(--cyan);}


/* ── GZCLP ─────────────────────────────────────── */
.gzclp-wrap{padding:0 14px 32px;}
.gzclp-divider{border:none;border-top:1px solid var(--border);margin:20px 0 16px;}
.taper-box{border:1px solid #4dd0e1;background:var(--panel);padding:10px 12px;margin-bottom:10px;}
.taper-head{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:#4dd0e1;margin-bottom:7px;}
.taper-days{display:flex;gap:4px;flex-wrap:wrap;}
.taper-day{flex:1;min-width:64px;text-align:center;padding:5px 2px;border:1px solid var(--border);}
.taper-day.today{border-color:#4dd0e1;background:rgba(77,208,225,.12);}
.taper-wd{font-family:monospace;font-size:10px;letter-spacing:1px;color:var(--muted);}
.taper-day.today .taper-wd{color:#4dd0e1;}
.taper-act{font-size:10px;margin-top:2px;}
.taper-note{font-size:11px;margin-top:7px;color:#aabbcc;line-height:1.6;}
.taper-sessions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.taper-sess{flex:1;min-width:200px;border:1px solid var(--border);background:#0a0a15;padding:8px 10px;font-size:11px;line-height:1.7;}
.taper-sess-head{font-family:monospace;font-size:10px;letter-spacing:1px;color:#4dd0e1;margin-bottom:4px;}
.tb{font-family:monospace;font-size:10px;letter-spacing:1px;}
.tb-wu{color:var(--muted);} .tb-t3{color:var(--green);} .tb-rev{color:#ff8a65;} .tb-cd{color:var(--muted);}
.taper-tiers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
@media(max-width:560px){.taper-tiers{grid-template-columns:1fr;}}
.gzclp-topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.gzclp-title{font-family:monospace;font-size:11px;letter-spacing:3px;color:var(--accent);}
.gzclp-sub{font-family:monospace;font-size:11px;letter-spacing:1px;color:var(--cyan);margin-top:4px;}
.gzclp-day-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.gzclp-day-btn{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.5px;padding:5px 12px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);transition:all .2s;-webkit-tap-highlight-color:transparent;}
.gzclp-day-btn.active{font-size:12px;padding:6px 16px;color:var(--text);}
.gzclp-day-btn.next-day{border-style:dashed;color:var(--text);}
.next-indicator{color:var(--accent);font-weight:700;}
.gzclp-tiers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;}
@media(max-width:600px){.gzclp-tiers{grid-template-columns:1fr;}}
.gzclp-tier{border:1px solid var(--border);background:#0a0a15;position:relative;overflow:hidden;padding:12px 13px 11px;}
.gzclp-tier::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.gzclp-tier.t1::before{background:linear-gradient(90deg,var(--accent),transparent 60%);box-shadow:0 0 6px var(--accent);}
.gzclp-tier.t2::before{background:linear-gradient(90deg,var(--cyan),transparent 60%);}
.gzclp-tier.t3::before{background:linear-gradient(90deg,var(--green),transparent 60%);}
.gzclp-badge{font-family:monospace;font-size:11px;letter-spacing:2px;padding:2px 8px;border:1px solid;clip-path:polygon(3px 0%,100% 0%,calc(100% - 3px) 100%,0% 100%);display:inline-block;margin-bottom:7px;}
.t1 .gzclp-badge{color:var(--accent);border-color:var(--accent);background:#7b5cff11;}
.t2 .gzclp-badge{color:var(--cyan);border-color:var(--cyan);background:#00e5ff11;}
.t3 .gzclp-badge{color:var(--green);border-color:var(--green);background:#00ffb311;}
.gzclp-exname{font-family:'Oxanium',sans-serif;font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--text);margin-bottom:5px;line-height:1.3;}
.gzclp-scheme{font-family:'Space Mono',monospace;font-size:12px;color:var(--text);margin-bottom:6px;}
.gzclp-wt{font-family:monospace;font-size:12px;margin-bottom:2px;}
.gzclp-prog{font-family:monospace;font-size:12px;color:var(--text);margin-top:6px;line-height:1.5;}
.gzclp-tier-note{font-family:monospace;font-size:11px;color:var(--yellow);margin-top:5px;padding:3px 7px;background:#ffd60009;border-left:2px solid var(--yellow);}
.gzclp-fb-wrap{border:1px solid var(--border);background:#0a0a15;overflow:hidden;}
.gzclp-fb-head{font-family:monospace;font-size:11px;letter-spacing:2px;color:var(--accent);padding:6px 12px;border-bottom:1px solid var(--border);background:#0d0d18;display:flex;justify-content:space-between;align-items:center;}
.gzclp-fb-row{padding:4px 12px;border-bottom:1px solid #0f0f1a;font-family:monospace;font-size:11px;line-height:1.4;display:flex;gap:8px;align-items:flex-start;}
.gzclp-fb-row:last-child{border-bottom:none;}
.fb-ok{color:var(--green);}
.fb-warn{color:var(--yellow);}
.fb-crit{color:var(--red);}
.fb-info{color:var(--cyan);}
.gzclp-period{font-family:monospace;font-size:11px;color:var(--text);padding:4px 12px;background:#080810;border-top:1px solid var(--border);}
.gzclp-t3-full{grid-column:1/-1;border:1px solid var(--border);background:#0a0a15;position:relative;overflow:hidden;padding:12px 13px 11px;}
.gzclp-t3-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
@media(max-width:500px){.gzclp-t3-grid{grid-template-columns:1fr;}}
.gzclp-t3-item{padding:7px 10px;border:1px solid var(--border);background:#0d0d18;}
.gzclp-rest-line{font-family:monospace;font-size:11px;margin-top:7px;padding-top:6px;border-top:1px solid #1a1a2e;}
.gzclp-wu-inline{margin-top:9px;padding-top:8px;border-top:1px solid #1a1a2e;}
.gzclp-wu-inline-title{font-family:monospace;font-size:11px;letter-spacing:1px;color:var(--cyan);margin-bottom:4px;}
.gzclp-wu-inline-row{display:flex;gap:10px;font-family:monospace;font-size:11px;padding:2px 0;align-items:baseline;}
.gzclp-wu-inline-work{font-weight:700;padding-top:4px;margin-top:2px;border-top:1px solid #1a1a2e;}
.gzclp-wu-rest{font-family:monospace;font-size:10px;color:var(--text);padding:1px 0 1px 4px;letter-spacing:.5px;}
.gzclp-wu-rest-work{color:var(--accent);font-size:10px;padding-bottom:3px;}
/* Tier body flex layout */
.gzclp-tier-body{display:flex;gap:12px;flex-direction:column;}
@media(min-width:600px){.gzclp-tier-body{flex-direction:row;align-items:flex-start;}}
.gzclp-tier-main{flex:1;min-width:0;}
.gzclp-wu-details{flex:0 0 auto;min-width:150px;max-width:200px;}
@media(max-width:599px){.gzclp-wu-details{max-width:100%;}}
.gzclp-wu-summary{font-family:monospace;font-size:10px;letter-spacing:1px;cursor:pointer;list-style:none;padding:4px 0;text-transform:uppercase;}
.gzclp-wu-summary::-webkit-details-marker{display:none;}
/* WU/WERK-markering: wat in JEFIT als "warm-up" moet, en wat als werkset.
   Kleuren volgen de badges elders in de app (oranje = opwarming, cyaan = werk). */
.wu-tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;padding:1px 4px;border-radius:2px;border:1px solid #ff6b3566;color:#ff8a5c;background:#ff6b3515;flex:0 0 auto;}
.wu-tag-work{border-color:#00e5ff66;color:#5ff0ff;background:#00e5ff15;}
.wu-hint{font-family:monospace;font-size:10px;color:var(--text);padding:4px 0 2px;letter-spacing:.3px;}
.wu-none{font-family:monospace;font-size:10px;color:#5ff0ff;padding:3px 0;letter-spacing:.3px;}
/* Mobiliteitsopwarming per dag (uitvouwbaar, staat vóór de tiers) */
.mobwu{grid-column:1/-1;border:1px solid #1a1a2e;border-radius:4px;padding:6px 9px;margin-bottom:9px;}
.mobwu>summary{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--cyan);cursor:pointer;list-style:none;}
.mobwu>summary::-webkit-details-marker{display:none;}
.mobwu>summary::before{content:'▸ ';}
.mobwu[open]>summary::before{content:'▾ ';}
.mobwu-row{display:flex;justify-content:space-between;gap:10px;font-family:monospace;font-size:11px;padding:3px 0;border-top:1px solid #14141f;}
.mobwu-row:first-of-type{border-top:none;margin-top:5px;}
.mobwu-row i{color:var(--muted);font-style:normal;font-size:10px;}
/* Lift tile sets */
.lift-tile-sets{font-family:monospace;font-size:9px;color:var(--text);margin-top:1px;line-height:1;}
/* Analysis panel collapsible */
#analysis-details summary::-webkit-details-marker{display:none;}
#analysis-details summary{list-style:none;}
.gzclp-details{margin-top:8px;border:1px solid var(--border);background:#0a0a15;overflow:hidden;}
.gzclp-coll-head{font-family:monospace;font-size:11px;letter-spacing:2px;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none;user-select:none;background:#0d0d18;}
.gzclp-coll-head::-webkit-details-marker{display:none;}
.gzclp-details[open] .gzclp-coll-head{border-bottom:1px solid var(--border);}
.gzclp-details-body{padding:10px 13px;}
.gzclp-wu-title{font-family:monospace;font-size:11px;letter-spacing:1px;margin-bottom:5px;}
.gzclp-wu-row{display:flex;gap:10px;font-family:monospace;font-size:11px;padding:3px 0;border-bottom:1px solid #0f0f1a;align-items:baseline;}
.gzclp-wu-work{border-top:1px solid #1a1a2e;margin-top:2px;padding-top:4px;border-bottom:none;}
.gzclp-stretch-item{font-family:monospace;font-size:11px;padding:4px 0;border-bottom:1px solid #0f0f1a;color:var(--text);line-height:1.45;}
.gzclp-rules{margin-top:0;border:1px solid var(--border);background:#0a0a15;overflow:hidden;}
.gzclp-rules-head{font-family:monospace;font-size:11px;letter-spacing:2px;color:var(--accent);padding:10px 12px;cursor:pointer;list-style:none;user-select:none;background:#0d0d18;display:flex;justify-content:space-between;align-items:center;}
.gzclp-rules-head::-webkit-details-marker{display:none;}
.gzclp-rules[open] .gzclp-rules-head{border-bottom:1px solid var(--border);}
.gzclp-rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;}
@media(max-width:600px){.gzclp-rules-grid{grid-template-columns:1fr;}}
.gzclp-rule{padding:9px 13px;border-bottom:1px solid #0f0f1a;border-right:1px solid #0f0f1a;}
.gzclp-rule:nth-child(even){border-right:none;}
.gzclp-rule-title{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;margin-bottom:3px;}
.gzclp-rule-body{font-family:monospace;font-size:11px;color:var(--text);line-height:1.55;}

.page-nav{display:flex;justify-content:center;gap:8px;padding:10px 18px;background:#090910;border-bottom:1px solid var(--border);position:relative;z-index:10;flex-wrap:wrap;}

.nav-item.nav-active{color:var(--accent);border-color:var(--accent);background:#7b5cff18;box-shadow:0 0 10px #7b5cff22;}
.nav-item.nav-stats-active{color:var(--cyan);border-color:var(--cyan);background:#00e5ff18;box-shadow:0 0 10px #00e5ff22;}
.nav-item.nav-supp-active{color:var(--green);border-color:var(--green);background:#00ffb318;box-shadow:0 0 10px #00ffb322;}

    const dow = (new Date(todayStr).getDay()+6)%7; // 0=ma
    // EXPLOSIVE: 3 gym-dagen (MA=0, WO=1, ZA=2) — di/do/vr/zo → dichtstbijzijnde gym dag

    const WEEK6_DAG = {'2026-09-29': 'MA', '2026-09-30': 'DI', '2026-10-02': 'ZA'};
    const defDayIdxBase = (() => {

      if (lastTrainingDate === todayStr) return (baseIdx + 1) % 3;

    const DI_CATCHUP = { date: '2026-08-11', weekFrom: '2026-08-09', weekTo: '2026-08-16' };
    const DI_CATCHUP_WK = Math.floor((new Date(DI_CATCHUP.date) - new Date(ph.start)) / (7*86400000));
    function applyDiCatchup(dayp, wk, dIdx) {
      if (ph.name !== 'EXPLOSIVE' || wk !== DI_CATCHUP_WK) return {dayp, dIdx};

      const diH = 'DI+ · INHAAL LOWER (vr. 7 aug gemist) · gewichten wk3? · ±65 MIN';

      let newIdx = dIdx >= 2 ? dIdx + 1 : dIdx;

    }

    // Eenmalige VR-dagkaart, vrijdag 25 sep 2026. Bert traint een dag na de
    // DO+-krachtsessie en drie dagen voor het opbouwblok start. De rug krijgt
    // daarom niets: geen stang op de rug, geen hinge. Benen via de machine,
    // glutes via de hip thrust, en het grootste deel van de tijd naar de
    // elleboog, want dat is wat het meest zeurt. Verdwijnt vanzelf na 25 sep.
    const VR_DAG = '2026-09-25';
    function applyVrijdag(dayp, wk, dIdx) {
      // wk is de index BÍNNEN de bekeken fase, dus week 6 van OPBOUW heeft net als
      // de deloadweek index 0. Zonder de fasecheck hieronder verscheen de VR-tab
      // ook in week 6 en 8 wanneer je vooruit bladerde.
      if (actPh.name !== 'DELOAD') return {dayp, dIdx};
      if (todayStr !== VR_DAG || wk !== curWk) return {dayp, dIdx};
      const gl = (t) => '<b style="color:#ff6b35">' + t + '</b>';
      const kaart = {
        h: 'VR \u00b7 BENEN ZONDER RUG + ELLEBOOG \u00b7 \u00b140 MIN',
        banner: 'Geen stang op je rug vandaag. Je trainde gisteren, zondag is kickboksen en maandag staat squat 80 met deadlift 75 \u2014 '

              + 'een rustdag v\u00f3\u00f3r die maandag. Benen mogen wel, zolang de wervelkolom er niet onder staat. '
              + 'De elleboog krijgt het grootste deel van de tijd, want dat is wat het meest zeurt.',
        tiers: [
          ['T2','Front Squat','HACK SQUAT of LEG PRESS','3 \u00d7 10-12','\u2014','2 min',
           'Stop de beweging v\u00f3\u00f3rdat je bekken van de steun rolt \u2014 dat kantelpunt onderin is waar je rug alsnog meedoet. Gewicht dat de laatste rep nog schoon laat.',true],
          ['T3','Hip Thrust','HIP THRUST \u00b7 PLATE-LOADED','3 \u00d7 10-15','\u2014','90 sec',
           'Vast onderdeel na de venus magna. Billen aanspannen bovenaan, niet met de lage rug omhoog duwen.',true]],
        t3note: 'Elleboog \u2014 de volgorde is niet vrij: eerst glijden, dan isometrisch houden, dan pas traag belasten. '
              + 'Klap UITVOERING open voor de details. Pijn tot 3 \u00e0 4 op 10 tijdens de oefening mag, als ze binnen 24 uur gezakt is. '
              + 'Voor het zenuwwerk geldt een strengere grens: tinteling of branderigheid die n\u00e1 de oefening blijft hangen betekent te ver.',
        t3: [
          ['Radiale zenuwglijding','2 \u00d7 10-15 \u00b7 traag',null,true,
           'Sta rechtop, arm langs je lichaam, schouder actief naar beneden gedrukt en daar houden \u2014 dat is het anker van de hele oefening.<br><br>'
           + 'Strek je elleboog en draai je onderarm naar binnen zodat je handpalm naar achter wijst. Breng de arm zo\u2019n 30 tot 45 graden van je romp weg, naar achter-opzij. Duim naar binnen vouwen, vingers eroverheen.<br><br>'
           + gl('Dit is het hele punt:') + ' terwijl je je pols naar beneden buigt, kantel je je hoofd n\u00e1\u00e1r die arm toe. En terwijl je de pols weer laat ontspannen, kantel je je hoofd ervan w\u00e9g. '
           + 'Zo trek je de zenuw aan het ene uiteinde terwijl je hem aan het andere loslaat \u2014 hij schuift heen en weer in plaats van dat de spanning ergens oploopt. Daarom hoort dit v\u00f3\u00f3r de belasting.<br><br>'
           + 'Traag, klein bereik, en nergens stilstaan op het eindpunt. Het is glijden, geen rek. Voel je tinteling die blijft hangen nadat je gestopt bent, dan ging je te ver.'],
          ['Isometrische supinatie','5 \u00d7 30-45 sec \u00b7 rust 1-2 min',null,true,
           'Zit, elleboog in 90 graden en tegen je zij geklemd, onderarm op je dijbeen. Elleboog blijft daar \u2014 gaat hij van je zij af, dan neemt je schouder het over.<br><br>'
           + 'Pak een hamer onderaan de steel met de kop naar boven, of gebruik gewoon je andere hand als weerstand. Draai je handpalm naar boven en h\u00f3\u00fad die stand tegen de weerstand in.<br><br>'
           + gl('Waarom dit eerst komt:') + ' weerstand tegen supinatie is precies wat bij jou pijn doet, dus dat is het weefsel dat belasting nodig heeft. Isometrisch vasthouden belast een pees zonder hem door zijn bereik te sleuren, '
           + 'en geeft bij peesklachten vaak een paar uur echte pijndemping. Dat is meteen je test: voelt je elleboog na deze vijf series beter, dan is dit je ingang.<br><br>'
           + 'Ongeveer zeventig procent van je kracht, niet maximaal. Rustig doorademen.'],
          ['Supinatie met hamer of elastiek','3 \u00d7 15 \u00b7 traag terug',null,true,
           'Zelfde houding als hierboven. Draai naar supinatie in \u00e9\u00e9n tel en laat in drie \u00e0 vier tellen terugzakken naar pronatie.<br><br>'
           + gl('Alleen doen als de isometrie schoon aanvoelde.') + ' Deed die al pijn boven de 4 op 10, dan sla je dit over en blijf je vandaag bij glijden en houden.<br><br>'
           + 'De traagheid is het werk, niet het gewicht. Een hamer bij de steel vastgepakt is genoeg; hoe verder je hand van de kop zit, hoe zwaarder het wordt.'],
          ['\u2014 wat je vandaag niet doet \u2014','','',true,
           'Geen hard knijpwerk, geen hangen aan een stang, geen eindstandig rekken van de pols. Dat zijn de drie dingen die een gemengd pees-en-zenuwbeeld opjagen. '
           + 'En geen bovengreep-trekwerk: dat belast de aanhechting van je polsstrekkers het hardst.']]
      };
      const out = dayp.slice();
      let iZa = out.findIndex(function(x){ return x.key === 'ZA'; });
      if (iZa < 0) iZa = out.length;
      out.splice(iZa, 0, {key:'VR', color:'#00e5a0', card: kaart, tiers: kaart.tiers,
                          t3: kaart.t3, t3note: kaart.t3note, banner: kaart.banner, wu:'za', sessKey:'VR'});
      // sessKey 'VR' bestaat niet in CORE_BLOK, dus het coreblok valt vandaag weg — bewust:
      // de ZA-core bevat sit-ups en flutter kicks, allebei lumbale flexie, en dat is
      // precies de richting waar de rug deze maand twee keer op reageerde.
      return {dayp: out, dIdx: iZa};
    }

    function applyWeekOverrides(dayp, wk, dIdx) {
      if (testPrepActive() && wk === curWk) {
        return {dayp: testPrepDays(), dIdx: testPrepIdx()};
      }
      // Aanloop naar di 13 okt — vervangt de dagtabs van de actieve week volledig.
      if (kmPrepActive() && wk === curWk) {
        return {dayp: kmPrepDays(), dIdx: kmPrepIdx()};
      }
      const di = applyDiCatchup(dayp, wk, dIdx);
      const sw = applyDaySwap(di.dayp, wk, di.dIdx);
      const eb = applyElleboogWeek(sw.dayp, wk, sw.dIdx);
      const de = applyDoExtra(eb.dayp, wk, eb.dIdx);
      return applyVrijdag(de.dayp, wk, de.dIdx);
    }

    let activeWk = curWk;
    let activePlanIdx = 0;
    const _ovr0 = applyWeekOverrides(buildDayp(activeWk), activeWk, defDayIdxBase);
    let currentDayp   = _ovr0.dayp;
    let defDayIdx     = _ovr0.dIdx;
    let activeDayIdx  = defDayIdx;

    const wkRow  = document.getElementById('prog-wk-btns');
    const dayRow = document.getElementById('prog-day-btns');
    const cardEl = document.getElementById('prog-day-card');
    const phHead = document.getElementById('prog-phase-head');

    // ── Mobiliteitsopwarming per dag ────────────────────────────────────
    // Stond eerder alleen op de PROGRAM-pagina; hoort hier, want dit is de
    // pagina die je in de gym openhebt. Per dagslot: ma/wo/za, ook geldig
    // voor de STRENGTH-namen (SQUAT=ma, BENCH=wo, DEADLIFT=za).
    // Core bijgestuurd op 21 aug 2026 naar wat Bert feitelijk logt sinds juni:
    // Sit-Up is zijn meest gedane core-oefening (7x) maar stond nergens in het
    // schema; Heel Touch stond op maandag terwijl hij hem op woensdag doet.
    // Superman blijft staan als enige rug-extensie — Berts eigen keuze.
    // Core is op 21 aug 2026 uit de opwarming gehaald: het is een eigen blok van
    // 10 min mét rust geworden (zie CORE_BLOK). Hier blijft alleen mobiliteit.
    const WU_MOB = {
      ma: {core:'mobiliteit', rows:[
        ['Leg Swings voor + opzij','10/kant','heup · hamstrings'],
        ['Hip Circles','10/kant','heup activatie'],
        ['Arm Swings','15×','schouder activatie'],
        ["World's Greatest Stretch",'5/kant','thoracaal']]},
      wo: {core:'mobiliteit', rows:[
        ['Cat-Cow','6×','rugmobiliteit'],
        ['Push-ups','1 × 12','borst/schouder']]},
      za: {core:'mobiliteit', rows:[
        ['Leg Swings voor + opzij','10/kant','hamstrings · heup'],
        ['Glute Bridge BW','15×','glute activatie'],
        ["World's Greatest Stretch",'5/kant','thoracaal']]}
    };
    // Corekaart per dag — 10 min inclusief 45 sec rust tussen de sets.
    // Samengesteld uit wat Bert feitelijk logt, met ab wheel en leg raise terug
    // (die deed hij in juni en liet hij vallen) en plank erbij op zijn verzoek.
    // REV roteert: elke sessie één mobilisatie en één voetboog-oefening.
    // 4 mobilisatie x 3 voetboog over 3 sessies/week -> cyclus rond in 4 weken,
    // precies de lengte van het blok. Indeling met Bert vastgelegd op 22 aug.
    const REV_MOB = [
      ['Toe Dorsiflex Lunge', '2×10/kant', 'MTP-gewricht grote teen'],
      ['RDL banded mediaal', '3×8', 'heupscharnier · mediale knierotatie'],
      ['Rathleff Heel Raise', '3×20', 'hiel door volledige range']
    ];
    const REV_VOET = [
      ['Y Balans met elastiek onder teen', '3×4/kant', 'teen- en boogcontrole'],
      ['Twee platen: tenen en hiel apart', '3×30 sec', 'boog draagt zichzelf'],
      ['Unipodale RDL met elastiek', '3×8/kant', 'boog onder belasting, eenbenig'],
      ['Hip Bridge, tenen op bankje', '3×12', 'boog belast in verkorte enkelpositie']
    ];
    const CORE_BLOK = {
      MA: ['Ab wheel 3×8', 'Plank 3×45 sec'],
      WO: ['Dead Bug 3×12 + 30 sec hold', 'Alternating Heel Touch 3×10'],
      // Bert 28 aug: side plank en flutter kick erbij, superman blijft staan.
      // Vijf items past niet in 10 min — dit is een keuzelijst, niet een af te vinken rij.
      ZA: ['Parallel Bar Leg Raise 3×8', 'Sit-Up 2×12', 'Superman 2×10',
           'Side Plank 2×40 sec', 'Flutter Kick 1×20']
    };
    const WU_SLOT = {MA:'ma', WO:'wo', ZA:'za', SQUAT:'ma', BENCH:'wo', DEADLIFT:'za', 'DI+':'za'};

    function _mobWuHtml(dayKey) {
      const slot = WU_SLOT[dayKey];
      if (!slot || !WU_MOB[slot]) return '';
      const w = WU_MOB[slot];
      const rows = w.rows.map(r =>
        '<div class="mobwu-row"><span>' + r[0] + '</span>' +
        '<span style="white-space:nowrap">' + r[1] + ' <i>· ' + r[2] + '</i></span></div>').join('');
      return '<details class="mobwu"><summary>OPWARMING · ' + w.core.toUpperCase() +
             '</summary>' + rows + '</details>';
    }

    function renderCard(dayIdx) {
      const d = currentDayp[dayIdx];
      const wk = activeWk;

      // Flat renderer voor DI (cardio) en niet-EXPLOSIVE fases
      if (d.flat || (!d.tiers && (actPh.name !== 'EXPLOSIVE' || d.key === 'DI'))) {
        cardEl.innerHTML = '<div class="taper-sess" style="min-width:0"><div class="taper-sess-head" style="color:' + d.color + '">' + d.card.h + '</div>' +
          _mobWuHtml(d.wu || d.sessKey || d.key) +
          d.card.r.map(l => '<span class="tb ' + l[0] + '">' + l[1] + '</span> ' + l[2]).join('<br>') + '</div>';
        return;
      }

      // ── Helpers ─────────────────────────────────────────────────────
      const _BBL = new Set(['Squat','Deadlift','Bench','OHP','Front Squat','Row']);

      // Elke set krijgt een WU- of WERK-markering: dat is precies het onderscheid dat
      // Bert in JEFIT moet aanvinken (set_type warm-up vs default). Lifts zonder
      // opwarming zeggen dat óók expliciet — stilte zou hij als "nog niet ingevuld"
      // kunnen lezen, en dan vinkt hij alsnog een werkset als warm-up aan.
      function _wuHtml(lk, w, isT1, c) {
        if (!w) return '';
        const rows = isT1 ? t1Warmup(w, lk) : t2Warmup(w, lk);
        const wPlts = _BBL.has(lk) ? platesPerSide(w) : null;
        const wPltsH = wPlts ? '<span style="color:var(--muted);font-family:monospace;font-size:10px;margin-left:6px">[' + wPlts + ']</span>' : '';
        const workRow = '<div class="gzclp-wu-inline-row gzclp-wu-inline-work" style="color:' + c + '"><span class="wu-tag wu-tag-work">WERK</span><span style="min-width:48px">' + w + ' kg</span><span style="color:var(--text)">werkgewicht</span>' + wPltsH + '</div>';
        if (!rows.length) {
          return '<details class="gzclp-wu-details"><summary class="gzclp-wu-summary" style="color:' + c + '">GEEN OPWARMSET <span style="color:var(--text);font-size:10px">(klik open)</span></summary><div class="gzclp-wu-inline"><div class="wu-none">Alle sets als werkset loggen — niets aanvinken als warm-up in JEFIT.</div>' + workRow + '</div></details>';
        }
        const restRow = '<div class="gzclp-wu-rest">— 60 sec</div>';
        const rowsHtml = rows.map((r, i) => {
          const plts = _BBL.has(lk) ? platesPerSide(r.w) : null;
          const pltsH = plts ? '<span style="color:var(--muted);font-family:monospace;font-size:10px;margin-left:6px">[' + plts + ']</span>' : '';
          return '<div class="gzclp-wu-inline-row"><span class="wu-tag">WU</span><span style="color:' + c + ';min-width:48px">' + r.w + ' kg</span><span style="color:var(--text)">× ' + r.reps + '</span>' + pltsH + '</div>' + (i < rows.length - 1 ? restRow : '');
        }).join('');
        const hint = '<div class="wu-hint">' + rows.length + ' × WU in JEFIT aanvinken · de rest is werkset</div>';
        return '<details class="gzclp-wu-details"><summary class="gzclp-wu-summary" style="color:' + c + '">OPWARMING · ' + rows.length + ' SET' + (rows.length > 1 ? 'S' : '') + ' <span style="color:var(--text);font-size:10px">(klik open)</span></summary><div class="gzclp-wu-inline">' + hint + rowsHtml + '<div class="gzclp-wu-rest gzclp-wu-rest-work">— 2 min</div>' + workRow + '</div></details>';
      }

      function _tierCard(badge, lk, name, scheme, w, rest, cue, isT1, noWu, extraHtml, noPrev) {
        const c = liftColor(lk) || d.color;
        const pW = lastW(lk), pD = lastDate(lk);
        const plts = (_BBL.has(lk) && w) ? platesPerSide(w) : null;
        const ref = REF1RM[lk];
        const pctStr = (ref && w) ? ' <span style="font-size:11px;color:' + c + 'cc">· ' + Math.round(w/ref*100) + '% 1RM</span>' : '';
        const pltsLine = plts ? '<div style="font-family:monospace;font-size:11px;color:var(--muted);margin-top:2px">◧ ' + plts + '</div>' : '';
        const prevLine = (pW && !noPrev) ? '<div style="font-size:11px;color:' + c + 'cc;margin-bottom:4px">vorig: ' + pW + ' kg' + (pD ? ' · ' + pD : '') + '</div>' : '';
        const wu = (noWu ? '' : _wuHtml(lk, w, isT1 !== false, c)) + (extraHtml || '');
        return '<div class="gzclp-tier" style="border-color:' + c + '33">' +
          '<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,' + c + ',transparent 70%);box-shadow:0 0 6px ' + c + '66"></div>' +
          '<div class="gzclp-tier-body"><div class="gzclp-tier-main">' +
          '<span class="gzclp-badge" style="color:' + c + ';border-color:' + c + ';background:' + c + '15">' + badge + '</span>' +
          '<div class="gzclp-exname" style="color:' + c + '">' + name + '</div>' +
          (cue ? '<div style="font-family:monospace;font-size:10px;color:var(--muted);margin-bottom:4px;font-style:italic">' + cue + '</div>' : '') +
          '<div class="gzclp-scheme">' + scheme + '</div>' +
          '<div class="gzclp-wt">' + prevLine + (w ? '<strong style="color:' + c + ';font-size:16px">' + w + ' kg</strong>' + pctStr : '<span style="color:var(--muted)">—</span>') + '</div>' + pltsLine +
          '<div class="gzclp-rest-line" style="color:' + c + '">⏱ ' + rest + '</div>' +
          '</div>' + wu + '</div></div>';
      }

      // 5e argument (optioneel): uitvoeringsuitleg die onder het item uitklapt.
      // Bestaande aanroepen geven vier argumenten en blijven ongewijzigd werken.
      function _t3Item(name, reps, lk, isRev, uitleg) {
        const bc = isRev ? '#ff6b35' : '#4caf50';
        const bg = isRev ? '#130b08' : '#0e1a0e33';
        const bd = isRev ? '#ff6b3533' : '#4caf5033';
        const badge = isRev ? 'REV' : 'T3';
        const pW = lk ? lastW(lk) : null;
        const pD = lk ? lastDate(lk) : null;
        const prevLine = pW ? '<div style="font-size:11px;color:var(--muted);margin-top:3px">vorig: ' + pW + ' kg' + (pD ? ' · ' + pD : '') + '</div>' : '';
        return '<div class="gzclp-t3-item" style="border-color:' + bd + ';background:' + bg + '">' +
          '<div style="display:flex;align-items:center;gap:5px;margin-bottom:2px">' +
          '<span style="font-family:\'Space Mono\',monospace;font-size:8px;letter-spacing:1px;padding:2px 5px;border:1px solid ' + bc + '55;border-radius:2px;color:' + bc + ';background:' + bg + '">' + badge + '</span>' +
          '<span style="font-family:\'Oxanium\',sans-serif;font-size:11px;font-weight:700;color:var(--text)">' + name + '</span>' +
          (reps ? '<span style="color:var(--cyan);font-family:\'Space Mono\',monospace;font-size:11px;margin-left:auto">' + reps + '</span>' : '') +
          '</div>' + prevLine +
          (uitleg
            ? '<details style="margin-top:5px">' +
              '<summary style="font-family:\'Space Mono\',monospace;font-size:10px;color:' + bc + ';cursor:pointer;user-select:none">\u25b8 UITVOERING</summary>' +
              '<div style="font-size:11px;line-height:1.65;color:var(--text);padding:6px 2px 2px">' + uitleg + '</div>' +
              '</details>'
            : '') +
          '</div>';
      }

      // Eigen blok i.p.v. een regel in de opwarming: core heeft nu een tijdsbudget
      // en rusttijd, net als T1/T3. Core staat ook in de deloadweek (Lotte, 21 aug).
      function _coreBlock(dayKey) {
        // Lotte, 21 aug: core blijft ook in de deloadweek staan — kleine moeite,
        // geen extra belasting, en die sessie is toch korter.
        const items = CORE_BLOK[dayKey];
        if (!items || !items.length) return '';
        const rows = items.map(function(t){
          return '<div class="gzclp-t3-item" style="border-color:#00e5ff33;background:#06121a">' +
            '<div style="font-size:12px;color:var(--text)">' + t + '</div></div>';
        }).join('');
        return '<div class="gzclp-tier gzclp-t3-full" style="border-color:#00e5ff33;grid-column:1/-1">' +
          '<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),transparent 70%)"></div>' +
          '<span class="gzclp-badge" style="color:var(--cyan);border-color:var(--cyan);background:#00e5ff15">CORE</span>' +
          '<div style="font-family:\'Space Mono\',monospace;font-size:10px;color:var(--muted);margin:2px 0 6px">10 min totaal · 45 sec rust telt mee · vóór de liften</div>' +
          '<div class="gzclp-t3-grid">' + rows + '</div></div>';
      }

      function _t3Block(mainItems, note) {
        return '<div class="gzclp-tier gzclp-t3-full" style="border-color:#00ffb333;grid-column:1/-1">' +
          '<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),transparent 70%)"></div>' +
          '<span class="gzclp-badge" style="color:var(--green);border-color:var(--green);background:#00ffb315">T3</span>' +
          (note ? '<div style="font-family:\'Space Mono\',monospace;font-size:10px;color:var(--muted);margin:2px 0 6px">' + note + '</div>' : '') +
          '<div class="gzclp-t3-grid">' + mainItems + '</div></div>';
      }

      // REV als eigen kaart, niet meer vastgeplakt aan T3 — anders viel REV weg
      // op maandag, want die dag heeft geen T3.
      function _revBlock(dayKey) {
        const dagN = {MA:0, WO:1, ZA:2}[dayKey];
        if (dagN === undefined) return '';
        const n = (typeof activeWk === 'number' ? activeWk : 0) * 3 + dagN;
        // Vaste volgorde van 12 sessies i.p.v. twee losse cycli. Met 3 mobilisaties
        // en 3 sessies per week valt de ene cyclus op de andere: n % 3 maakt de
        // mobilisatie dagvast, en (week + dag) % 3 laat 2 van de 12 paren dubbel
        // voorkomen terwijl 2 andere nooit langskomen. Deze tabel haalt alles
        // tegelijk: 12 unieke paren, elke mobilisatie 4x, elke voetboog 3x, en
        // elke dag krijgt alle drie de mobilisaties.
        const REV_PLAN = [[0,0],[1,1],[2,2],[1,3],[2,0],[0,1],[2,3],[0,2],[1,0],[0,3],[1,2],[2,1]];
        const pick = REV_PLAN[n % REV_PLAN.length];
        const paar = [REV_MOB[pick[0]], REV_VOET[pick[1]]];
        const rows = paar.map(function(x, i){
          return '<div class="gzclp-t3-item" style="border-color:#ff6b3533;background:#130b08">' +
            '<div style="font-family:\'Space Mono\',monospace;font-size:8px;letter-spacing:1px;color:#ff6b35;margin-bottom:2px">' +
            (i ? 'VOETBOOG' : 'MOBILISATIE') + '</div>' +
            '<div style="font-size:12px;color:var(--text)">' + x[0] + ' · ' + x[1] + '</div>' +
            '<div style="font-size:10px;color:var(--muted);margin-top:2px">' + x[2] + '</div></div>';
        }).join('');
        return '<div class="gzclp-tier gzclp-t3-full" style="border-color:#ff6b3533;grid-column:1/-1">' +
          '<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#ff6b35,transparent 70%)"></div>' +
          '<span class="gzclp-badge" style="color:#ff6b35;border-color:#ff6b35;background:#ff6b3515">REV</span>' +
          '<div style="font-family:\'Space Mono\',monospace;font-size:10px;color:var(--muted);margin:2px 0 6px">' +
          'Elke sessie één mobilisatie en één voetboog · roteert per sessie</div>' +
          '<div class="gzclp-t3-grid">' + rows + '</div></div>';
      }

      // ── Per dag opbouwen ─────────────────────────────────────────────
      const expReps = wk === 1 ? '4-3-4' : wk === 2 ? '3×3' : '3×4';
      let tiersHtml = '';

      // Taperdagen leveren hun eigen tier-definities aan, zodat ze dezelfde
      // kaartopmaak krijgen als de gewone EXPLOSIVE-dagen (badge, gewicht,
      // schijvenberekening, opwarmaccordeon) i.p.v. de kale platte lijst.
      if (d.tiers) {
        if (d.banner) {
          tiersHtml += '<div style="grid-column:1/-1;font-family:\'Space Mono\',monospace;font-size:10px;color:var(--muted);padding:4px 2px 8px;border-bottom:1px solid var(--border);margin-bottom:4px;">' + d.banner + '</div>';
        }
        // Core staat vóór de liften — Berts eigen volgorde (21 aug).
        tiersHtml += _coreBlock(d.sessKey || d.key);
        d.tiers.forEach(function(t){ tiersHtml += _tierCard.apply(null, t); });
        if (d.t3 && d.t3.length) {
          tiersHtml += _t3Block(d.t3.map(function(x){ return _t3Item.apply(null, x); }).join(''), d.t3note);
        }
        tiersHtml += _revBlock(d.sessKey || d.key);
      } else if (d.key === 'MA') {
        // Zelfde afwijkende speed-squat-lijn als in buildDayp() — wk3 blijft op 60
        // i.p.v. de formule (67,5), bevestigd door Bert op 3 aug.
        const SPEED_SQUAT = [62.5, 65, 60];
        tiersHtml += _tierCard('SPEED','Squat',    'SPEED SQUAT',    expReps + ' · max barsnelheid', r25(SPEED_SQUAT[Math.min(wk, SPEED_SQUAT.length-1)]), '90 sec · langer als snelh. daalt', 'Heupen naar voren · billen aanspannen', false, true);
        tiersHtml += _tierCard('SPEED','Bench',    'SPEED BENCH',    expReps + ' · explosief omhoog', r25(60+2.5*wk), '90 sec · langer als snelh. daalt', 'Hielen op grond · billen op de bank', false, true);
        tiersHtml += _tierCard('SPEED','Deadlift', 'SPEED DEADLIFT', expReps + ' · hinge explosief',  r25(70+2.5*wk),   '90 sec · langer als snelh. daalt', 'Meer hinge · minder squat', false, true);
        tiersHtml += _tierCard('SPEED','Row',      'SPEED ROW',      expReps, r25(50+2.5*wk),  '90 sec · langer als snelh. daalt', null, false, true);
        tiersHtml += _t3Block(
          _t3Item('Hip Thrust (plate-loaded)', '3×15', null, false) +
          _t3Item('T3 naar keuze', '', null, false)
        );
      } else if (d.key === 'WO') {
        // Weekgewichten woensdag (index = wk, 0-based). Niet-lineair:
        //  bench +5/wk (65 was comfortabel: 8·8·10 op 29 jul; 70×8×3 schoon op 5 aug
        //  bevestigt de sprong naar 75 voor wk3 — Bert akkoord 6 aug)
        //  row blijft vlak op 60 (5 aug: wel alle 30 reps, maar nipt — nog niet omhoog)
        const WO_BENCH = [65, 70, 75];
        const WO_ROW   = [60, 60, 60];
        tiersHtml += _tierCard('T2','Bench', 'BARBELL BENCH PRESS', '3 × 8', WO_BENCH[Math.min(wk, WO_BENCH.length-1)], '2 min', 'Hielen op grond · billen op de bank', false);
        tiersHtml += _tierCard('T2','Row',   'BARBELL ROW',         '3 × 10', WO_ROW[Math.min(wk, WO_ROW.length-1)],  '2 min', 'Alle 30 reps op hetzelfde gewicht → volgende week omhoog', false);
        tiersHtml += _t3Block(
          _t3Item('Lat Pulldown (wide grip)', '3×12', 'Lat PD',    false) +
          _t3Item('Face Pull (rope)',         '3×12', 'Face Pull', false) +
          _t3Item('Triceps Pushdown (rope)',  '3×14', null,        false) +
          _t3Item('Bicep Curl (DB alt.)',     '3×12', null,        false)
        );
      } else { // ZA
        // Weekgewichten zaterdag (index = wk, 0-based), afgeleid uit de logs:
        //  DL  — lineaire PR-lijn t/m 115×5×2 op 13 jul; geen AMRAP in EXPLOSIVE (2×5)
        //  OHP — PR-lijn 52,5 (9 jun) → 55 (3 jul) → 60×5 (17 jul)
        const ZA_SQUAT = [87.5, 90, 92.5];
        const ZA_DL    = [115, 117.5, 120];
        const ZA_OHP   = [57.5, 60, 62.5];
        // Primer i.p.v. volle ZA-sessie in wk3: DI+ inhaal (di 11 aug, zelfde
        // week) deed Squat/DL/OHP al zwaar mét nieuwe PR's, en za 15 aug moet
        // fris houden voor Lotte-kalibratie (do 20 aug). Licht + kort, techniek/
        // bar-snelheid, geen belaste T3 — incline walk als cooldown i.p.v.
        // stairmaster (minder beenvermoeidheid). Bert, 11 aug.
        const zaVolLow = (wk === DI_CATCHUP_WK);
        if (zaVolLow) {
          tiersHtml += '<div style="grid-column:1/-1;font-family:\'Space Mono\',monospace;font-size:10px;color:var(--muted);padding:4px 2px 8px;border-bottom:1px solid var(--border);margin-bottom:4px;">Primer i.p.v. volle sessie — DI+ inhaal (di 11 aug) deed Squat/DL/OHP al zwaar, fris houden voor Lotte-kalibratie do 20 aug</div>';
        }
        tiersHtml += _tierCard('T1','Squat',    'BACK SQUAT',     (zaVolLow ? '2 × 5 — primer' : '3 × 5 — gecontroleerd'), (zaVolLow ? 65 : ZA_SQUAT[Math.min(wk, ZA_SQUAT.length-1)]), '3 min',   'Heupen naar voren · billen aanspannen', true);
        tiersHtml += _tierCard('T1','Deadlift', 'DEADLIFT',       (zaVolLow ? '2 × 3 — primer' : '2 × 5 — geen AMRAP'), (zaVolLow ? 60 : ZA_DL[Math.min(wk, ZA_DL.length-1)]),    '3–5 min', 'Explosief blok: sets afmaken, niet uitknijpen', true);
        tiersHtml += _tierCard('T2','OHP',      'OVERHEAD PRESS', (zaVolLow ? '2 × 5 — primer' : '3 × 5'), (zaVolLow ? 45 : ZA_OHP[Math.min(wk, ZA_OHP.length-1)]),   '2–3 min', 'Buik aanspannen · bovenlijf als plank', false);
        tiersHtml += zaVolLow
          ? _t3Block(_t3Item('Incline walk · 10% · ~5 km/h (geen stairmaster)', '15 min · zone 2', null, false))
          : _t3Block(
              _t3Item('Hip Thrust (plate-loaded)', '3×15', 'Hip Thrust', false) +
              _t3Item('Leg Curl',                  '3×12', 'Leg Curl',   false) +
              _t3Item('Abductor Machine',          '3×15', 'Abductor',   false)
            );
      }

      cardEl.innerHTML =
        '<div style="font-family:\'Oxanium\',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;color:' + d.color + ';margin-bottom:10px">' + d.card.h + '</div>' +
        '<div class="gzclp-tiers" style="grid-template-columns:repeat(2,1fr)">' + _mobWuHtml(d.wu || d.sessKey || d.key) + tiersHtml + '</div>';
    }

    function switchWeek(idx) {
      const e = PLAN[idx];
      if (!e) return;
      // Dagkey onthouden zodat je bij het bladeren op dezelfde dag blijft staan.
      const prevKey = currentDayp[activeDayIdx] ? currentDayp[activeDayIdx].key : null;
      actPh = e.phase;
      activeWk = e.wk;
      activePlanIdx = idx;
      const isCur = (idx === curPlanIdx);
      const baseIdx = isCur ? defDayIdxBase : 0;
      const _r = applyWeekOverrides(buildDayp(e.wk), e.wk, baseIdx);
      currentDayp = _r.dayp;
      let newIdx = _r.dIdx;
      if (prevKey) {
        const found = currentDayp.findIndex(function(x){ return x.key === prevKey; });
        if (found >= 0) newIdx = found;
      }
      activeDayIdx = newIdx;
      const wkTxt = (e.phase.totalWks > 1) ? ' · WEEK ' + (e.wk+1) : '';
      phHead.textContent = '◈ ' + e.phase.name + wkTxt + (isCur ? '' : ' · ' + e.start.slice(8) + '/' + e.start.slice(5,7) + ' (vooruitblik)');
      phHead.style.color = e.phase.color;
      phHead.style.opacity = isCur ? '1' : '0.75';
      if (wkRow) wkRow.querySelectorAll('.prog-wk-btn').forEach(function(b,j){
        b.style.fontWeight = j === idx ? 'bold' : 'normal';
        b.style.opacity = j === idx ? '1' : '0.45';
        b.style.borderBottomWidth = j === idx ? '2px' : '1px';
      });
      renderDayButtons();
      renderCard(activeDayIdx);
    }

    // Week buttons — één per week van het resterende plan
    if (wkRow && multiWk) {
      PLAN.forEach(function(e, i){
        const b = document.createElement('button');
        b.className = 'gzclp-day-btn prog-wk-btn';
        b.textContent = e.label;
        b.title = e.phase.name + ' · week van ' + e.start;
        b.style.borderColor = e.phase.color; b.style.color = e.phase.color;
        b.style.fontWeight = i === curPlanIdx ? 'bold' : 'normal';
        b.style.opacity = i === curPlanIdx ? '1' : '0.45';
        b.style.borderBottomWidth = i === curPlanIdx ? '2px' : '1px';
        b.style.fontSize = '10px';
        b.onclick = function(){ switchWeek(i); };
        wkRow.appendChild(b);
      });
    }

    // Day buttons — herbruikbaar zodat switchWeek() ze kan herbouwen (aantal
    // tabs verschilt: 4 in curWk met DI+ inhaaldag, 3 in andere weken).
    function renderDayButtons() {
      dayRow.innerHTML = '';
      currentDayp.forEach((d,i) => {
        const btn = document.createElement('button');
        btn.className = 'gzclp-day-btn' + (i===activeDayIdx ? ' active' : '');
        btn.textContent = d.key;
        btn.style.borderColor = d.color; btn.style.color = d.color;
        btn.onclick = () => {
          activeDayIdx = i;
          dayRow.querySelectorAll('.gzclp-day-btn:not(.prog-wk-btn)').forEach((x,j) => x.classList.toggle('active', j===i));
          renderCard(i);
        };
        dayRow.appendChild(btn);
      });
    }
    // ── ELBOW-paneel ────────────────────────────────────────────────────
    // Apart tabblad naast de weken (Bert, 15 sep 2026). Het onderarm- en
    // elleboogprotocol hangt niet aan een week of een dag, en je wil het in
    // de gym kunnen opslaan zonder door de dagkaarten te bladeren. Inhoud is
    // de mediale klacht van 2 sep (polsflexoren + pronator, ulnaire zenuw),
    // met de laterale variant erbij omdat Bert zelf "tenniselleboog" zegt.

    // ── BACK-paneel ─────────────────────────────────────────────────────
    // Lage rug, 14 sep 2026. Eenzijdig naast de wervelkolom, geen uitstraling,
    // geen tintelingen, geen krachtsverlies. Richtingsvoorkeur bleek extensie
    // (Bert, 15 sep: kussen achter de onderrug helpt bij zitten), dus het
    // protocol is extensiegericht en niet flexiegericht.

    renderDayButtons();
    renderCard(defDayIdx);
  })();

  const btnRow = document.getElementById('gzclp-day-btns');
  function applyBtnStyle(btn, day, active) {
    const c = day.t1color;
    if (active) {
      btn.style.color = c; btn.style.borderColor = c;
      btn.style.background = hex20(c); btn.style.boxShadow = `0 0 10px ${hex20(c)}`;
    } else {
      btn.style.color = ''; btn.style.borderColor = '';
      btn.style.background = ''; btn.style.boxShadow = '';
    }
  }
  const startDayIdx = nextDayIdx >= 0 ? nextDayIdx : 0;
  if (btnRow) {
    DAYS.forEach((d, i) => {
      const b = document.createElement('button');
      const isNext = i === nextDayIdx;
      b.className = 'gzclp-day-btn' + (i===startDayIdx ? ' active' : '') + (isNext ? ' next-day' : '');
      b.innerHTML = (isNext ? '<span class="next-indicator">!</span> ' : '') + d.key;
      applyBtnStyle(b, d, i === startDayIdx);
      b.onclick = () => {
        document.querySelectorAll('.gzclp-day-btn').forEach((btn, j) => {
          btn.classList.toggle('active', j === i);
          applyBtnStyle(btn, DAYS[j], j === i);
        });
        renderDay(i);
      };
      btnRow.appendChild(b);
    });
  }

  // Rekinstelling per lift (baar = j-hooks, veiligheid = spotter arms)
  const RACK_SETUP = {
    'Bench':       {bar: 12, safety: '4 zichtbaar'},
    'Front Squat': {bar: 19, safety: '4 zichtbaar'},
  };

  // T1 varianten per lift — tonen in de T1 kaart bij stagnatie
  const T1_VARIANTS = {
    'Squat':    ['Paused squat (60–70%)', 'Bulgarian split squat', 'Step-up'],
    'Bench':    ['Paused bench (70%)', 'Close-grip bench', 'Single-arm DB bench'],
    'Deadlift': ['Block pull', 'Romanian deadlift', 'Single-leg RDL'],
    'OHP':      ['Single-arm DB press', 'Push press'],
  };

  // Technische cues per lift — van Lotte
  const LIFT_CUES = {
    'Squat':    'Heupen naar voren · billen aanspannen',
    'Deadlift': 'Hoger starten (block pull) · meer hinge · minder squat',
    'OHP':      'Buik aanspannen · bovenlijf als plank',
    'Bench':    'Hielen op grond · billen op de bank duwen',
  };

  function renderDay(idx) {
    const day = DAYS[idx];
    const c = document.getElementById('gzclp-tiers');
    if (!c) return;
    const str = STRETCHES[day.key] || {pre:[], post:[]};
    // T3 scoring: dag-score + push/pull saldo boost + recency penalty
    function _t3Score(o) {
      let s = (o.dayScore?.[day.key] ?? 30);
      if (o.cat === 'glutes'   && _needsGlutes) s += 20;
      if (o.cat === 'pull'     && _needsPull)   s += 20;
      if (t3RecentlyDone(o))                    s -= 25;
      return s;
    }
    const _t3Rev  = T3_POOL.filter(o => o.type === 'REV');
    const _t3Main = T3_POOL.filter(o => o.type !== 'REV');
    const rankedT3 = [..._t3Main].sort((a,b) => _t3Score(b) - _t3Score(a));
    const t1lk = day.tiers[0].lk;
    const t1w  = nextW(t1lk, 'T1') ?? lastW(t1lk);

    // Warmup rows helper (inline in tier box)
    // workWLabel: optionele string override voor het werkgewicht-label (bv. "30 kg/arm")
    // lk: lift key — voor barbellgewichten worden platen per zijde getoond
    const _BARBELL_LKS = new Set(['Squat','Deadlift','Bench','OHP','Front Squat','Row']);
    // Zelfde WU/WERK-markering als in het programma-paneel: wat hier WU staat, vinkt
    // Bert in JEFIT als warm-up aan; al de rest logt hij als gewone set.
    function inlineWarmupHtml(rows, workW, liftC, workWLabel, lk) {
      if (!rows.length && !workW && !workWLabel) return '';
      const isBarbell = _BARBELL_LKS.has(lk);
      const restRow = `<div class="gzclp-wu-rest">— 60 sec</div>`;
      const rowsHtml = rows.map((r, i) => {
        const plts = isBarbell ? platesPerSide(r.w) : null;
        const pltsHtml = plts ? `<span style="color:var(--muted);font-family:monospace;font-size:10px;margin-left:6px">[${plts}]</span>` : '';
        return `<div class="gzclp-wu-inline-row">
          <span class="wu-tag">WU</span>
          <span style="color:${liftC};min-width:48px">${r.w} kg</span>
          <span style="color:var(--text)">× ${r.reps}</span>
          ${r.note ? `<span style="color:var(--cyan);font-size:11px">${r.note}</span>` : ''}
          ${pltsHtml}
        </div>${i < rows.length - 1 ? restRow : ''}`;
      }).join('');
      const showWork = workW || workWLabel;
      const wLabel = workWLabel || (workW + ' kg');
      const workPlts = (isBarbell && workW) ? platesPerSide(workW) : null;
      const workPltsHtml = workPlts ? `<span style="color:var(--muted);font-family:monospace;font-size:10px;margin-left:6px">[${workPlts}]</span>` : '';
      const preWorkRest = (showWork && rows.length) ? `<div class="gzclp-wu-rest gzclp-wu-rest-work">— 2 min</div>` : '';
      const workHtml = showWork ? `<div class="gzclp-wu-inline-row gzclp-wu-inline-work" style="color:${liftC}">
           <span class="wu-tag wu-tag-work">WERK</span>
           <span style="min-width:48px">${wLabel}</span>
           <span style="color:var(--text)">werkgewicht</span>
           ${workPltsHtml}
         </div>` : '';
      const head = rows.length
        ? `OPWARMING · ${rows.length} SET${rows.length > 1 ? 'S' : ''}`
        : 'GEEN OPWARMSET';
      const hint = rows.length
        ? `<div class="wu-hint">${rows.length} × WU in JEFIT aanvinken · de rest is werkset</div>`
        : `<div class="wu-none">Alle sets als werkset loggen — niets aanvinken als warm-up in JEFIT.</div>`;
      return `<details class="gzclp-wu-details">
    <summary class="gzclp-wu-summary" style="color:${liftC}">${head} <span style="color:var(--text);font-size:10px">(klik open)</span></summary>
    <div class="gzclp-wu-inline">
      ${hint}${rowsHtml}${preWorkRest}${workHtml}
    </div>
  </details>`;
    }

    const t2tier = day.tiers[1];
    const t2dispW = (() => {
      const w2 = lastW(t2tier.lk);
      if (t2tier.lk === t1lk) return t1w !== null ? r25(t1w * 0.75) : null;
      return w2 !== null ? w2 : (t1w !== null ? r25(t1w * 0.75) : null);
    })();

    const tierHtml = day.tiers.map(tier => {
      const liftC = liftColor(tier.lk);
      const w = lastW(tier.lk);
      const sameAsT1 = tier.t === 'T2' && tier.lk === t1lk;
      let dispW, srcLabel;
      if (tier.t === 'T1') {
        const suggested = nextW(tier.lk, 'T1');
        const last = lastW(tier.lk);
        dispW = suggested ?? last;
        srcLabel = (suggested !== null && suggested !== last) ? (tier.stepLabel + ' ✓') : 'HERHAAL';
      } else if (sameAsT1) {
        dispW = t1w !== null ? r25(t1w * 0.75) : null; srcLabel = 'T2 = 75% VAN T1';
      } else {
        const suggested = nextW(tier.lk, 'T2');
        const last = lastW(tier.lk);
        dispW = suggested ?? last ?? (t1w !== null ? r25(t1w * 0.75) : null);
        srcLabel = suggested !== null ? ((suggested !== last) ? (tier.stepLabel + ' ✓') : 'HERHAAL') : 'SCHATTING';
      }
      const isDB = tier.lk === 'DB Bench x2';
      const dispWStr = (dispW !== null && isDB)
        ? `2 × ${r25(dispW/2)}\u202fkg <span style="font-family:monospace;font-size:10px;color:${liftC}aa">(${r25(dispW/2)} kg/arm)</span>`
        : dispW !== null ? `${dispW} kg` : null;
      // Vorig gewicht + datum + pass/fail
      const _prevW    = lastW(tier.lk);
      const _prevDate = lastDate(tier.lk);
      const _isProgressing = srcLabel.endsWith('✓');
      const _isFail        = srcLabel === 'HERHAAL';
      const _prevWStr = _prevW !== null ? (isDB ? `${r25(_prevW/2)} kg/arm` : `${_prevW} kg`) : null;

      // Pass/fail bepalen op basis van laatste punt in data
      // Gebruikt work_reps (alleen reps op werkgewicht) indien beschikbaar, anders vol/w fallback
      let _lastPass = null;
      let _consecFails = 0;
      if ((tier.t === 'T1' || tier.t === 'T2') && tier.lk && DATA.lifts[tier.lk]) {
        const _pts = DATA.lifts[tier.lk].points;
        if (_pts && _pts.length) {
          const _lp = _pts[_pts.length - 1];
          const _lp_reps = _lp.work_reps !== undefined ? _lp.work_reps
                         : (_lp.volume && _lp.weight ? Math.round(_lp.volume / _lp.weight) : null);
          if (_lp_reps !== null) {
            if (tier.t === 'T1') {
              const _fx = tier.lk === 'Deadlift' ? 5 : 10;
              _lastPass = (_lp_reps - _fx) >= 5;
            } else {
              _lastPass = _lp_reps >= 30;
            }
          }
          // Tel opeenvolgende fails voor reset-regel
          const _fx2 = tier.t === 'T1' ? (tier.lk === 'Deadlift' ? 5 : 10) : 0;
          const _thr = tier.t === 'T1' ? 5 : 30;
          for (let _i = _pts.length - 1; _i >= 0; _i--) {
            const _p = _pts[_i];
            const _r = _p.work_reps !== undefined ? _p.work_reps
                     : (_p.volume && _p.weight ? Math.round(_p.volume / _p.weight) : null);
            if (_r === null) break;
            if ((_r - _fx2) < _thr) _consecFails++;
            else break;
          }
        }
      }

      // Pass: toon in vorig-regel. Fail: aparte failLine — nooit als onderdeel van prevLine
      // om verwarring "herhaal + fail" op dezelfde regel te vermijden.
      const _prevLine = _prevWStr
        ? `<div style="font-size:11px;color:${liftC}cc;margin-bottom:5px">vorig: ${_prevWStr}${_prevDate ? ` · ${_prevDate}` : ''}${_isProgressing ? ' <span style=\"color:#00ffb3;font-size:11px\">pass</span>' : ''}</div>` : '';

      let wHtml;
      if (dispWStr === null) {
        wHtml = `<div class="gzclp-wt" style="color:var(--muted)">— geen data</div>`;
      } else if (_isProgressing) {
        // Pass: vorig toont oud gewicht + "pass", hoofd toont nieuw (hogere) gewicht
        wHtml = `<div class="gzclp-wt">${_prevLine}<strong style="color:${liftC};font-size:16px">${dispWStr}</strong></div>`;
      } else if (_isFail) {
        // Fail: aparte failLine met gewicht + "fail ×N"
        const _failCount = _consecFails >= 2 ? ` fail ×${_consecFails}` : ' fail';
        const _failLine = _prevWStr
          ? `<div style="font-size:11px;color:${liftC}cc;margin-bottom:5px">vorig: ${_prevWStr}${_prevDate ? ` · ${_prevDate}` : ''} <span style="color:#ff3d6b;font-size:11px">${_failCount}</span></div>` : '';
        if (_consecFails >= 2) {
          // 2× gefaald → reset −10%
          const _resetW   = r25(_prevW * 0.9);
          const _resetStr = isDB ? `2 × ${r25(_resetW/2)} kg` : `${_resetW} kg`;
          wHtml = `<div class="gzclp-wt">${_failLine}<span style="color:#ff3d6b;font-size:12px">−10%</span> <strong style="color:${liftC};font-size:16px">${_resetStr}</strong></div>`;
        } else {
          // 1× gefaald → herhaal. Gewicht NIET herhalen — staat al in failLine.
          wHtml = `<div class="gzclp-wt">${_failLine}<span style="color:var(--yellow);font-size:14px">↻ herhaal</span></div>`;
        }
      } else if (srcLabel === 'T2 = 75% VAN T1') {
        wHtml = `<div class="gzclp-wt"><strong style="color:${liftC};font-size:16px">${dispWStr}</strong></div>`;
      } else {
        wHtml = `<div class="gzclp-wt">${_prevLine}<strong style="color:${liftC};font-size:16px">${dispWStr}</strong> <span style="color:var(--muted);font-size:11px">(schatting)</span></div>`;
      }
      // Block Pull note: vermeld als de laatste BP recenter is dan de laatste echte DL
      if (tier.t === 'T1' && tier.lk === 'Deadlift') {
        const _bpPts = (DATA.lifts['Block Pull'] || {}).points || [];
        const _dlPts = (DATA.lifts['Deadlift'] || {}).points || [];
        const _lastBP = _bpPts.length ? _bpPts[_bpPts.length - 1] : null;
        const _lastDLDate = _dlPts.length ? _dlPts[_dlPts.length - 1].date : '';
        if (_lastBP && _lastBP.date >= _lastDLDate) {
          const _bpDateFmt = _lastBP.date.slice(5).replace('-', '/');
          wHtml += `<div style="font-size:11px;color:var(--muted);margin-top:5px;padding-top:5px;border-top:1px solid #1a1a2e;font-family:monospace">⛑ laatste DL-dag: block pull · ${_lastBP.weight} kg · ${_bpDateFmt}</div>`;
        }
      }
      const thisDW = tier.t === 'T1' ? dispW : (isDB ? null : t2dispW);
      const dbWorkLabel = (isDB && t2dispW) ? `${r25(t2dispW/2)}\u202fkg/arm` : null;
      const wuRows = tier.t === 'T1' ? t1Warmup(t1w, t1lk) : t2Warmup(t2dispW, t2tier.lk);
      const wuHtml = inlineWarmupHtml(wuRows, thisDW, liftC, dbWorkLabel, tier.lk);
      const rackCfg = RACK_SETUP[tier.lk];
      const rackHtml = rackCfg
        ? `<div style="font-family:monospace;font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:1px">BAAR ${rackCfg.bar} · VEILIGHEID ${rackCfg.safety}</div>`
        : '';
      return `<div class="gzclp-tier" style="border-color:${liftC}33">
  <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,${liftC},transparent 70%);box-shadow:0 0 6px ${liftC}66"></div>
  <div class="gzclp-tier-body">
    <div class="gzclp-tier-main">
      <span class="gzclp-badge" style="color:${liftC};border-color:${liftC};background:${liftC}15">${tier.t}</span>
      <div class="gzclp-exname" style="color:${liftC}">${tier.name}</div>
      ${rackHtml}${LIFT_CUES[tier.lk] ? `<div style="font-family:monospace;font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.5px;font-style:italic">${LIFT_CUES[tier.lk]}</div>` : ''}
      <div class="gzclp-scheme">${tier.scheme}</div>
      ${(() => {
        if (tier.t !== 'T1') return '';
        const vars = T1_VARIANTS[tier.lk] || [];
        if (!vars.length) return '';
        const clr = _consecFails >= 2 ? 'var(--red)' : _consecFails >= 1 ? 'var(--yellow)' : '#3a3a5a';
        const lbl = _consecFails >= 2 ? '⚠ VARIANT AANGERADEN' : _consecFails >= 1 ? '→ OVERWEEG VARIANT' : 'VARIANTEN';
        const txtClr = _consecFails >= 1 ? 'var(--muted)' : '#333355';
        return `<div style="margin-top:6px;padding-top:5px;border-top:1px solid #1a1a2e">
          <div style="font-family:monospace;font-size:9px;color:${clr};letter-spacing:1px;margin-bottom:2px">${lbl}</div>
          <div style="font-family:monospace;font-size:10px;color:${txtClr}">${vars.join(' · ')}</div>
        </div>`;
      })()}
      ${wHtml}
      <div class="gzclp-rest-line" style="color:${liftC}">⏱ ${tier.rest}</div>
    </div>
    ${wuHtml}
  </div>
</div>`;
    }).join('');

    // ── T3 UNIFIED BLOCK ───────────────────────────────────────────
    // Badge-kleuren
    const _BADGE_STYLE = {
      VAR:  `font-size:8px;letter-spacing:1px;padding:2px 5px;border:1px solid #ffb74d55;border-radius:2px;color:#ffb74d;background:#1a120633;flex-shrink:0`,
      SUPP: `font-size:8px;letter-spacing:1px;padding:2px 5px;border:1px solid #4caf5055;border-radius:2px;color:#4caf50;background:#0e1a0e33;flex-shrink:0`,
      REV:  `font-size:8px;letter-spacing:1px;padding:2px 5px;border:1px solid #ff6b3566;border-radius:2px;color:#ff6b35;background:#ff6b3510;flex-shrink:0`,
    };
    const _BORDER_HL  = `border-color:var(--accent)55;background:#0d0d20`;
    const _BORDER_VAR = `border-color:#ffb74d33;background:#1a1206`;
    const _BORDER_SUPP= `border-color:#4caf5033;background:#0e1a0e`;
    const _BORDER_REV = `border-color:#ff6b3533;background:#130b08`;

    function _t3ItemHtml(o, prefix) {
      const prevW = o.lk ? lastW(o.lk) : null;
      const lkColor = o.lk ? (LC[o.lk] || 'var(--muted)') : 'var(--muted)';
      const qualColor = o.lk ? (lastT3Quality(o.lk) ?? lkColor) : lkColor;
      const prevDate  = o.lk ? lastDate(o.lk) : null;
      const prevWLine = prevW !== null
        ? `<div style="font-size:11px;color:${qualColor};margin-top:3px">vorig: ${prevW} kg${prevDate ? ` · ${prevDate}` : ''}</div>`
        : '';
      const isHL  = prefix === '!';
      const nc = isHL ? 'var(--accent)' : (o.type === 'REV' ? '#ff6b35' : o.type === 'VAR' ? '#ffb74d' : 'var(--text)');
      const bdr = isHL ? _BORDER_HL : (o.type==='REV' ? _BORDER_REV : o.type==='VAR' ? _BORDER_VAR : _BORDER_SUPP);
      const badge = `<span style="font-family:'Space Mono',monospace;${_BADGE_STYLE[o.type]||''}">${o.type}</span>`;
      const pfx   = isHL ? `<span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--accent)">!</span>` : '';
      return `<div class="gzclp-t3-item" style="${bdr}">
        <div style="display:flex;align-items:center;gap:5px;margin-bottom:2px">
          ${badge}${pfx}
          <span style="font-family:'Oxanium',sans-serif;font-size:11px;font-weight:700;color:${nc}">${o.name}</span>
          <span style="color:var(--cyan);font-family:'Space Mono',monospace;font-size:11px;margin-left:auto">${o.reps}</span>
        </div>
        <div style="color:var(--muted);font-family:monospace;font-size:11px">${o.note}</div>
        ${prevWLine}
      </div>`;
    }

    const _top4 = rankedT3.slice(0, 4);
    const _rest = rankedT3.slice(4);

    const _mainItemsHtml = _top4.map((o, i) => _t3ItemHtml(o, i === 0 ? '!' : `${i+1}.`)).join('') +
      (_rest.length ? `<details style="grid-column:1/-1;margin-top:4px">
        <summary style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);cursor:pointer;user-select:none">▸ ${_rest.length} meer oefeningen</summary>
        <div class="gzclp-t3-grid" style="margin-top:6px">
          ${_rest.map((o,i) => _t3ItemHtml(o, `${_top4.length+i+1}.`)).join('')}
        </div>
      </details>` : '');

    const _revItemsHtml = _t3Rev.map(o => _t3ItemHtml(o, '')).join('');

    const t3Html = `<div class="gzclp-tier gzclp-t3-full" style="border-color:#00ffb333">
      <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),transparent 70%)"></div>
      <span class="gzclp-badge" style="color:var(--green);border-color:var(--green);background:#00ffb315">T3</span>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <div class="gzclp-exname" style="color:var(--green)">T3 — kies 1 of 2</div>
        <div style="font-family:monospace;font-size:11px;color:var(--green)">⏱ 60–120 sec</div>
      </div>
      <div class="gzclp-t3-grid">${_mainItemsHtml}</div>
      <div style="margin-top:10px;padding-top:8px;border-top:1px solid #ff6b3522">
        <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:#ff6b35;margin-bottom:6px">REVALIDATIE (altijd doen)</div>
        <div class="gzclp-t3-grid">${_revItemsHtml}</div>
      </div>
    </div>`;

    // Pre-stretch collapsible (before tiers)
    const preStretchEl = document.getElementById('gzclp-pre-stretch');
    if (preStretchEl) preStretchEl.innerHTML = `<details class="gzclp-details" style="margin-top:0;margin-bottom:8px">
      <summary class="gzclp-coll-head" style="color:var(--cyan)">▸ VOOR — activerende stretch</summary>
      <div class="gzclp-details-body">
        ${str.pre.map(s => `<div class="gzclp-stretch-item">${s}</div>`).join('')}
      </div>
    </details>`;

    // Post-stretch collapsible (after T3)
    const postStretchEl = document.getElementById('gzclp-post-stretch');
    if (postStretchEl) postStretchEl.innerHTML = `<details class="gzclp-details">
      <summary class="gzclp-coll-head" style="color:var(--green)">▸ NA — statische stretch</summary>
      <div class="gzclp-details-body">
        ${str.post.map(s => `<div class="gzclp-stretch-item">${s}</div>`).join('')}
      </div>
    </details>`;

    c.innerHTML = tierHtml + t3Html;
  }


  renderDay(startDayIdx);
});
// ══ END GZCLP ════════════════════════════════════════════════════════════════


</script>
</body>
</html>
